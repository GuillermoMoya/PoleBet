# API Gateway (T2-01) — única entrada web de los jugadores.
#
# Enruta:
#   /api/auth/  -> Usuarios     login y logout (sin sesión previa)
#   /api/ws     -> Motor        WebSocket del Difusor (protegido)
#   /api/       -> Orquestador  resto del REST (protegido), sin el prefijo /api
#   /           -> Front        SPA y assets
#
# En las rutas protegidas valida la sesión con auth_request contra Usuarios,
# descarta los headers de identidad que mande el cliente y reenvía solo los
# que devuelve Usuarios (X-User-Id, X-User-Rol). Sin sesión válida: 401.
#
# Se monta como conf.d/default.conf (dentro del bloque http de nginx).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    # Nadie entra con una identidad puesta por el cliente: solo vale la que
    # añade el Gateway tras auth_request. Se neutralizan en toda petición.
    proxy_set_header X-User-Id  "";
    proxy_set_header X-User-Rol "";

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"estado":"ok","servicio":"gateway"}';
    }

    # Validación de sesión. Interna: el cliente no la alcanza directamente.
    # Usuarios responde 200 con X-User-Id / X-User-Rol, o 401 si no hay sesión.
    location = /_auth {
        internal;
        set $usuarios http://usuarios:8001;
        proxy_pass              $usuarios/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
    }

    # --- MOCK temporal para probar el Gateway sin Usuarios (NO dejar activo) ---
    # Mientras Misael no entrega GET /internal/auth, las rutas protegidas no se
    # pueden validar de verdad. Para probar el enrutamiento y la inyección de
    # headers de extremo a extremo, comenta el location = /_auth de arriba y
    # descomenta este, que acepta cualquier sesión y devuelve un jugador fijo.
    # Hay que volver a dejar el real antes de cerrar T2-01.
    #
    # location = /_auth {
    #     internal;
    #     add_header X-User-Id  "00000000-0000-0000-0000-000000000001" always;
    #     add_header X-User-Rol "player" always;
    #     return 204;
    # }

    # Login / logout: sin sesión previa, directo a Usuarios.
    location /api/auth/ {
        set $usuarios http://usuarios:8001;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass $usuarios;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket del Motor (protegido). Antes de /api/ por ser más específico.
    location /api/ws {
        auth_request /_auth;
        auth_request_set $user_id  $upstream_http_x_user_id;
        auth_request_set $user_rol $upstream_http_x_user_rol;

        set $motor http://motor:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $motor;
        proxy_set_header Host       $http_host;
        proxy_set_header X-User-Id  $user_id;
        proxy_set_header X-User-Rol $user_rol;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Resto del REST (protegido) -> Orquestador, sin el prefijo /api.
    location /api/ {
        auth_request /_auth;
        auth_request_set $user_id  $upstream_http_x_user_id;
        auth_request_set $user_rol $upstream_http_x_user_rol;

        set $orquestador http://orquestador:8081;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $orquestador;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Id       $user_id;
        proxy_set_header X-User-Rol      $user_rol;
    }

    # SPA y assets del Front.
    location / {
        set $front http://front:80;
        proxy_pass $front;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
