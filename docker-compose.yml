# Prototipo 2 - ArquiSoft (PoleBet) — T2-04
#
# Levanta TODO el prototipo con un solo comando:
#
#   docker compose up --build
#
# Esta es la BASE del prototipo 2 (T2-04, Tomás). Los servicios de lógica que
# todavía no tienen su implementación real corren como STUB: una imagen mínima
# que solo responde GET /health, para que el stack entero arranque desde ya y
# cada dueño construya su servicio encima sin tocar la topología (redes,
# puertos, nombres y dependencias ya están decididos aquí).
#
#   Estado por servicio:
#     gateway        STUB  (Nginx)        -> T2-01  Tomás
#     front          REAL  (React+Nginx)  -> ya existía (P1); SSR es HU2-03 Misael
#     orquestador    REAL  (Go)           -> T2-02  Daniel (PR en revisión)
#     usuarios       STUB  (FastAPI)      -> tabla users lista (T2-03); rutas HU2-01/02/03 Misael
#     pagos          REAL  (FastAPI)      -> ya existía; dueño de PG Pagos
#     pagos-consumer REAL  (misma imagen de pagos, comando placeholder) -> HU2-18 consumidor AMQP
#     motor          REAL  (Go)           -> ya existía; lee Mongo, escribe Redis
#     ingestor       STUB  (Go)           -> HU2-16/19 Iván; único que escribe Mongo
#     admin          STUB  (FastAPI)      -> HU2-18/19 Iván; única otra entrada (8003)
#
#   Infra (imágenes oficiales, ya funcionan):
#     postgres-usuarios, postgres-pagos, mongo, redis, rabbitmq
#
# Puertos publicados al host: SOLO 80 (gateway) y 8003 (admin). Todo lo demás es
# interno a las redes de Docker (RNF-17: no se exponen los puertos internos).
#
# Redes (Vista C&C): borde / interna / datos. Cada base comparte red SOLO con su
# servicio dueño; por eso hay una red de datos por base.
#
# Configuración en .env (ver .env.example).

name: arquisoft-prototipo2

services:
  # ===========================================================================
  # Bases de datos (datos)
  # ===========================================================================

  # PostgreSQL Usuarios — dueño: servicio usuarios. Tabla users.
  postgres-usuarios:
    image: postgres:17-alpine
    container_name: arqui_pg_usuarios
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USUARIOS_DB_USER}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD}
      POSTGRES_DB: ${USUARIOS_DB_NAME}
    volumes:
      - pg_usuarios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USUARIOS_DB_USER} -d ${USUARIOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datos_usuarios

  # PostgreSQL Pagos — dueño: servicio pagos (y su consumidor).
  # wallets, events, event_entries, markets, bets, ledger_entries.
  postgres-pagos:
    image: postgres:17-alpine
    container_name: arqui_pg_pagos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PAGOS_DB_USER}
      POSTGRES_PASSWORD: ${PAGOS_DB_PASSWORD}
      POSTGRES_DB: ${PAGOS_DB_NAME}
    volumes:
      - pg_pagos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAGOS_DB_USER} -d ${PAGOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datos_pagos

  # MongoDB — dueño de escritura: ingestor. El motor solo lee.
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    container_name: arqui_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - datos_mongo

  # Redis — dueño: motor (fichas y ranking del torneo en curso).
  redis:
    image: redis:7-alpine
    container_name: arqui_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - datos_redis

  # Broker (RabbitMQ) — mensajería asíncrona Admin <-> Pagos / Ingestor.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: arqui_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - interna

  # ===========================================================================
  # Entrada (borde)
  # ===========================================================================

  # API Gateway — STUB (T2-01, Tomás). Única entrada web de los jugadores.
  gateway:
    build:
      context: ./services/gateway
    container_name: arqui_gateway
    restart: unless-stopped
    depends_on:
      - usuarios
      - orquestador
      - motor
      - front
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    networks:
      - borde
      - interna

  # Front (React + Vite servido por Nginx). SSR real llega con HU2-03 (Misael).
  front:
    build:
      context: ./services/front
    container_name: arqui_front
    restart: unless-stopped
    networks:
      - borde
      - interna

  # Admin — STUB (HU2-18/19, Iván). Segunda y última entrada publicada (8003).
  admin:
    build:
      context: ./services/admin
    container_name: arqui_admin
    restart: unless-stopped
    depends_on:
      usuarios:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s
    networks:
      - borde
      - interna

  # ===========================================================================
  # Lógica (interna)
  # ===========================================================================

  # Orquestador — REAL (T2-02, Daniel). Coordina flujos; no tiene base propia.
  # Se construye desde ./services/orquestador tal cual lo crea su PR, sin tocar
  # esa carpeta, para no generar conflictos cuando el PR se mergee.
  orquestador:
    build:
      context: ./services/orquestador
    container_name: arqui_orquestador
    restart: unless-stopped
    environment:
      USUARIOS_BASE_URL: http://usuarios:8001
      PAGOS_BASE_URL: http://pagos:8000
      MOTOR_BASE_URL: http://motor:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      HTTP_PORT: "8081"
    depends_on:
      - usuarios
      - pagos
      - motor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    networks:
      - interna

  # Usuarios — STUB (HU2-01/02/03, Misael). Dueño de PG Usuarios; ya crea la
  # tabla users al arrancar (T2-03).
  usuarios:
    build:
      context: ./services/usuarios
    container_name: arqui_usuarios
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${USUARIOS_DB_USER}:${USUARIOS_DB_PASSWORD}@postgres-usuarios:5432/${USUARIOS_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres-usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8001/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s
    networks:
      - interna
      - datos_usuarios

  # Pagos — REAL. Dueño de PG Pagos (tablas del P2, T2-03). Solo rutas
  # /internal/*: lo llaman el Orquestador y el Motor, nunca el navegador.
  pagos:
    build:
      context: ./services/pagos
    container_name: arqui_pagos
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${PAGOS_DB_USER}:${PAGOS_DB_PASSWORD}@postgres-pagos:5432/${PAGOS_DB_NAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      COP_PER_TOKEN: ${COP_PER_TOKEN}
    depends_on:
      postgres-pagos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s
    networks:
      - interna
      - datos_pagos

  # Consumidor AMQP de Pagos — misma imagen de pagos, proceso aparte.
  # HU2-21 (Guillermo): toma las consultas del administrador de RabbitMQ
  # (cola admin.consultas, prefetch 1) y responde por reply_to con
  # correlation_id. Las publica Admin (HU2-18, Iván) cuando exista.
  pagos-consumer:
    build:
      context: ./services/pagos
    container_name: arqui_pagos_consumer
    restart: unless-stopped
    command: ["python", "-m", "app.consumer"]
    environment:
      DATABASE_URL: postgresql+psycopg://${PAGOS_DB_USER}:${PAGOS_DB_PASSWORD}@postgres-pagos:5432/${PAGOS_DB_NAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres-pagos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - interna
      - datos_pagos

  # Motor de apuestas — REAL. Lee Mongo (solo lectura), escribe Redis.
  motor:
    build:
      context: ./services/motor
    container_name: arqui_motor
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      PAGOS_BASE_URL: http://pagos:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      BETTING_WINDOW_SECONDS: ${BETTING_WINDOW_SECONDS}
      OBSERVATION_WINDOW_SECONDS: ${OBSERVATION_WINDOW_SECONDS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      HTTP_PORT: "8080"
      # HU2-11: parametros del torneo para el ranking y la barra de avance.
      # Los mismos nombres que usa Pagos (HU2-06); valores por defecto si no
      # estan en el .env. El motor igual trae defaults internos (1000/10/50).
      EVENT_INITIAL_CHIPS: ${EVENT_INITIAL_CHIPS:-1000}
      EVENT_COMMISSION_PCT: ${EVENT_COMMISSION_PCT:-10}
      EVENT_MIN_WAGER_PCT: ${EVENT_MIN_WAGER_PCT:-50}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      pagos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s
    networks:
      - interna
      - datos_mongo
      - datos_redis

  # Ingestor — STUB (HU2-16/19, Iván). Único que ESCRIBE en Mongo. Habla con el Broker.
  ingestor:
    build:
      context: ./services/ingestor
    container_name: arqui_ingestor
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      HTTP_PORT: "8002"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    networks:
      - interna
      - datos_mongo

# =============================================================================
# Redes (Vista C&C): borde / interna / datos (una por base, para que cada base
# comparta red SOLO con su servicio dueño — RNF-18).
# =============================================================================
networks:
  borde:
    driver: bridge
  interna:
    driver: bridge
  datos_usuarios:
    driver: bridge
  datos_pagos:
    driver: bridge
  datos_mongo:
    driver: bridge
  datos_redis:
    driver: bridge

volumes:
  pg_usuarios_data:
  pg_pagos_data:
  mongo_data:
