name: CI

# Corre en cada push a main y en cada Pull Request.
# Cada servicio tiene su propio job y solo se ejecuta si cambiaron sus archivos,
# para no gastar minutos de Actions de mas.
on:
  push:
    branches: [main]
  pull_request:

# Si se empuja algo nuevo al mismo PR/rama, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detecta que carpetas cambiaron para activar solo los jobs necesarios.
  # ---------------------------------------------------------------------------
  cambios:
    runs-on: ubuntu-latest
    outputs:
      motor: ${{ steps.filtro.outputs.motor }}
      pagos: ${{ steps.filtro.outputs.pagos }}
      front: ${{ steps.filtro.outputs.front }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            motor:
              - 'services/motor/**'
              - '.github/workflows/ci.yml'
            pagos:
              - 'services/pagos/**'
              - '.github/workflows/ci.yml'
            front:
              - 'services/front/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Motor (Go): go vet, build y tests.
  # ---------------------------------------------------------------------------
  motor:
    needs: cambios
    if: needs.cambios.outputs.motor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/motor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/motor/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

  # ---------------------------------------------------------------------------
  # Pagos (FastAPI): pytest contra un PostgreSQL de servicio.
  # ---------------------------------------------------------------------------
  pagos:
    needs: cambios
    if: needs.cambios.outputs.pagos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pagos
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arqui
          POSTGRES_PASSWORD: arqui_pass
          POSTGRES_DB: apuestas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arqui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://arqui:arqui_pass@localhost:5432/apuestas_db
      JWT_SECRET: secreto-de-pruebas
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/pagos/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # ---------------------------------------------------------------------------
  # Front (React/Vite): instala, corre tests si existen y compila.
  # Nota: el script "test" (vitest) aun no esta en package.json; mientras no
  # exista, el paso de tests se salta sin romper el CI.
  # ---------------------------------------------------------------------------
  front:
    needs: cambios
    if: needs.cambios.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/front/package-lock.json
      - run: npm install
      - name: Tests (si hay script "test")
        run: |
          if npm run | grep -q '^  test'; then
            npm test
          else
            echo "No hay script 'test' en package.json; se omite (falta configurar vitest)."
          fi
      - run: npm run build
